# Единое Сердце дома rtynbirf: один обход 41 репо в неделю вместо ботов в каждом.
# Пишет PULSE.md + audit/pulse-<дата>.json и коммитит их. Красные — в РАНЫ.
name: pulse-heart

on:
  schedule:
    - cron: "0 4 * * 1"   # понедельник 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dom-obhod
  cancel-in-progress: false

jobs:
  beat:
    name: Обход дома + PULSE.md
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Удар сердца (обход всех репо)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 tools/pulse_heart.py
      - name: Коммит пульса
        run: |
          git config user.name "polimat-heart"
          git config user.email "polimat-heart@users.noreply.github.com"
          # Урок красных 42466691086 / 42466954893 / 42500555202 (2026-11-08):
          # checkout берёт SHA на момент диспатча, а параллельные волны
          # (inventory-weekly, субагенты) успевают запушить первыми —
          # push отклоняется «fetch first». Догоняем tip main ДО коммита
          # и повторяем push с rebase до 5 раз.
          git fetch origin main
          # Волна ×5 (урок 42529470365): у обхода есть артефакты вне PULSE.md —
          # rebase с грязным деревом ронял retry-луп «cannot rebase: unstaged changes».
          # --autostash в обоих rebase.
          git rebase --autostash origin/main
          git add PULSE.md audit/pulse-*.json
          if git diff --cached --quiet; then
            echo "ПУЛЬС БЕЗ ИЗМЕНЕНИЙ"
          else
            git commit -m "pulse: еженедельный обход дома ($(date -u +%F))"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push отклонён (гонка параллельных волн), попытка $i: rebase и повтор"
              git fetch origin main
              git rebase --autostash origin/main || git rebase --abort
            done
            if [ "$ok" != "1" ]; then
              echo "::error::push пульса не прошёл после 5 попыток rebase+push — на main продолжают писать параллельные волны"
              exit 1
            fi
          fi
