name: "secret-immunity — секрет-лейкоцит (П-40)"

# П-40 (polimat-hub#61): скан секретов — постоянный фоновый контур роя,
# а не стартовая молитва агента. Деревья + ХВОСТЫ КРАСНЫХ ЛОГОВ (уникальность).
# Итог — строка в СВОД-СЕКРЕТЫ.md (append-only); находка = issue P0.

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "api — деревья+логи через API (по умолчанию, как раньше); local — скан локального чекаута хаба (--root .)"
        default: api

permissions:
  contents: write
  issues: write

concurrency:
  group: secret-immunity
  cancel-in-progress: false

jobs:
  leukocyte:
    name: Скан деревьев и красных логов
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Лейкоцит
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          OWNER: rtynbirf
        run: |
          if [ "${{ github.event.inputs.scan_mode || 'api' }}" = "local" ]; then
            python3 scripts/secret_leukocyte.py --root .
          else
            python3 scripts/secret_leukocyte.py
          fi
      - name: Пломба СВОД-СЕКРЕТЫ.md (append-only)
        run: |
          set -euo pipefail
          if git diff --quiet -- СВОД-СЕКРЕТЫ.md; then
            echo "СВОД без изменений"
          else
            git config user.name "secret-leukocyte-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add СВОД-СЕКРЕТЫ.md
            git commit -m "leukocyte: замер секретов — строка в СВОД-СЕКРЕТЫ.md [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
            git push
          fi
