name: "root-oracle — оракул корня (П-23)"

# П-23 (polimat-hub#41): единый диагноз из логов для массовых красных.
# Цели — 6 репо tripwire (карта W-AUD-02). Если все зелёные — честный ноль.
# Артефакт tripwire-root-cause.json — доказательство для волны.

on:
  schedule:
    - cron: "41 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-oracle
  cancel-in-progress: false

jobs:
  oracle:
    name: Диагноз хвостов логов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Оракул корня
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          OWNER: rtynbirf
          ROOT_CAUSE_JSON: tripwire-root-cause.json
        run: python3 scripts/tripwire_root_cause.py
      # Артефакт — вспомогательное доказательство, не приговор оракула:
      # при исчерпании квоты хранилища (лаг пересчёта 6-12 ч) загрузка падает,
      # но диагноз уже напечатан в логе шага выше — честный ноль не должен
      # красить latest-прогон (гигиена красного CI, волна x9, 2026-11-09).
      - name: Артефакт диагноза
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-root-cause
          path: tripwire-root-cause.json
          if-no-files-found: ignore
