name: RITUAL · закон дома (конечный автомат)

# Закон дома №13 (canon: repo-doctrine/25-ритуал-дома-конечный-автомат-2026-11-10.md)
# Формула: ПОРАБОТАЛ → СДЕЛАЛ → УБРАЛ ЗА СОБОЙ → ЧИСТ.
# Автомат не останавливается в грязном состоянии.

on:
  schedule:
    - cron: '37 2 * * *' # свободное окно (урок У-5: не шаблонный крон)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ritual-sweep
  cancel-in-progress: false

jobs:
  ritual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (SHA-пин, У-7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Прогон автомата
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 tools/ritual_sweep.py
