name: 'osps-gate · OSPS-Baseline матрица (evaluate)'

on:
  schedule:
    # вторник 05:47 UTC — свободное окно против шаблонных кронов (гигиена кронов, урок У-5)
    - cron: "47 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    name: 'Самопроверка без сети (канон мембраны)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 'SELFTEST — фикстуры, ноль сетевых запросов'
        run: python3 tools/osps_baseline_check.py --selftest

  matrix:
    name: 'Живой прогон: OSPS-матрица публичных репо'
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 'Прогон живого аудита (evaluate: вердикт без exit-1)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/osps_baseline_check.py --live
      - name: 'Матрица в step summary'
        if: always()
        run: |
          latest=$(ls -t audit/osps-baseline-*.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 'Коммит матрицы в audit/ (канон hub, самовыравнивание)'
        if: always()
        run: |
          latest=$(ls -t audit/osps-baseline-*.md 2>/dev/null | head -1)
          latest_json=$(ls -t audit/osps-baseline-*.json 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$latest" "$latest_json" 2>/dev/null
            if git diff --cached --quiet; then
              echo 'матрица без изменений — коммита нет'
            else
              git commit -m "osps-gate: свежая матрица [skip ci]" --quiet
              git push --quiet
              echo 'матрица закоммичена'
            fi
          fi
